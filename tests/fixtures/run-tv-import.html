<!doctype html>
<html>
<head><meta charset="utf-8"><title>TradingView importer test runner</title></head>
<body>
<!-- Runs tvStartImport/tvPollImport inside the fake page, as Firefox does with executeScript({ func }). -->
<iframe id="f" style="width:900px;height:500px"></iframe>
<pre id="out">PENDING</pre>
<script src="../../content/tradingview-importer.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const text = params.get('text') || '';
  const f = document.getElementById('f');
  f.src = 'tradingview-add.html?' + new URLSearchParams({ existing: params.get('existing') || '' });
  f.onload = async () => {
    const w = f.contentWindow;
    const start = w.eval('(' + tvStartImport.toString() + ')(' + JSON.stringify(text) + ')');
    let poll;
    for (let i = 0; i < 200; i++) {
      await new Promise((r) => setTimeout(r, 100));
      poll = w.eval('(' + tvPollImport.toString() + ')()');
      if (poll.state !== 'running') break;
    }
    document.getElementById('out').textContent = JSON.stringify({ start, result: poll.result, list: w.document.getElementById('list').textContent });
  };
</script>
</body>
</html>
