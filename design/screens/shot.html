<!doctype html>
<!-- AMO screenshot frame: the popup check page, scaled, on a plain 1280x800 ground.
     Open with ?p=<popup-check query>&tab=import|export&last=1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #e9eef6; }
  body { display: grid; place-items: center; }
  .pop { width: 380px; height: 600px; border: 0; background: #fff; border-radius: 10px;
         box-shadow: 0 2px 6px rgba(20, 40, 80, .12), 0 18px 48px rgba(20, 40, 80, .18);
         transform: scale(1.25); transform-origin: center; }
</style>
</head>
<body>
<iframe class="pop" id="pop"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const pop = document.getElementById('pop');
  pop.src = '/tests/fixtures/popup-check.html?' + (q.get('p') || '');
  pop.addEventListener('load', () => {
    const d = pop.contentDocument;
    const click = (id) => { const b = d.getElementById(id); if (b) b.click(); };
    setTimeout(() => {
      if (q.get('tab') === 'import') click('tabImport');
      if (q.get('tab') === 'export') click('tabExport');
    }, 300);
    setTimeout(() => { if (q.get('last')) click('imUseLast'); }, 700);
    // Fit the frame to the popup body, as Firefox does.
    setTimeout(() => { pop.style.height = Math.min(600, d.body.offsetHeight) + 'px'; }, 1400);
  });
</script>
</body>
</html>
